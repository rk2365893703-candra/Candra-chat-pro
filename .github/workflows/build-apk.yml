name: Build Candra Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract Android project
        run: |
          rm -rf CandraChatAndroid
          unzip -q CandraChat_Android_Project.zip

      - name: Build APK
        working-directory: CandraChatAndroid/android
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CandraChat-debug-apk
          path: CandraChatAndroid/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
